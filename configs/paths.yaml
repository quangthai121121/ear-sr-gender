# =============================================================================
# CENTRAL PATH CONFIG — edit these paths to match your machine, then leave
# every script alone. All code reads paths from here (see src/config.py).
# =============================================================================

paths:
  # ---- Raw dataset -----------------------------------------------------
  # Root of EarVN1.0 as downloaded from Mendeley Data
  # (https://data.mendeley.com/datasets/yws3v3mwx3). build_metadata.py
  # auto-detects the on-disk layout, so EITHER of these works:
  #   (a) <data_root>/<subject_folder>/*.jpg          (no "images" subdir)
  #   (b) <data_root>/images/<subject_folder>/*.jpg    (with "images" subdir)
  # Subject folder names can be "01", "001_", "001.ALI_HD", etc. -- only
  # the LEADING NUMBER is used to determine subject id / gender, e.g.:
  #   001.ALI_HD/*.jpg    -> subject_id=1
  #   002.LeDuong_BL/*.jpg -> subject_id=2
  #   ...
  #   164.<name>/*.jpg    -> subject_id=164
  data_root: "./data/raw/EarVN1.0"

  # ---- Cached SR outputs -------------------------------------------------
  # Real-ESRGAN / SwinIR are expensive, so their x4 outputs are precomputed
  # once and cached here, mirroring data_root's exact on-disk layout
  # (whatever that is -- see data_root's comment above).
  # Bicubic is cheap and is NOT cached — it's computed on the fly in the
  # Dataset class. Put this on a fast/large disk; full-res x4 PNGs for
  # ~28k images can take tens of GB per SR method.
  processed_root: "./data/processed"
  # -> processed_root/realesrgan/<subject>/<file>.png
  # -> processed_root/swinir_large/<subject>/<file>.png

  # ---- Metadata / splits (small CSVs, kept inside the repo) -------------
  meta_root: "./data/meta"

  # ---- Cloned SR repositories (see scripts/01_clone_sr_repos.sh) --------
  # Each repo gets its own venv (their pinned deps, e.g. basicsr, can
  # conflict with the classifier env) -- point *_python at that venv's
  # interpreter. scripts/01_clone_sr_repos.sh creates these automatically.
  realesrgan_repo: "./external/Real-ESRGAN"
  realesrgan_python: "./external/Real-ESRGAN/.venv/bin/python"
  swinir_repo: "./external/SwinIR"
  swinir_python: "./external/SwinIR/.venv/bin/python"

  # ---- SR model checkpoints (see scripts/02_download_sr_checkpoints.sh) -
  realesrgan_ckpt: "./checkpoints/sr/realesrgan/RealESRGAN_x4plus.pth"
  swinir_large_ckpt: "./checkpoints/sr/swinir/003_realSR_BSRGAN_DFOWMFC_s64w8_SwinIR-L_x4_GAN.pth"

  # ---- Trained classifier checkpoints ------------------------------------
  classifier_ckpt_root: "./checkpoints/classifiers"

  # ---- Results / tables / logs -------------------------------------------
  results_root: "./results"

  # ---- Locked training config (written by scripts/06_hp_search.sh) ------
  locked_config: "./configs/locked_config.yaml"

sr:
  # How many images share ONE subprocess call (= one model load onto GPU)
  # during precompute. The dominant cost for tiny ear crops is NOT the
  # per-image forward pass -- it's repeatedly reloading the SR checkpoint
  # onto the GPU. One call per SUBJECT (as opposed to one call for many
  # subjects' worth of images) means paying that load cost ~164 times
  # instead of ~28 times. Raise this if you have enough tmp disk space
  # and want fewer, larger batches; lower it if a crash mid-batch should
  # lose less resumable progress.
  precompute_batch_size: 1000

  # Real-ESRGAN inference settings (passed to the cloned repo's CLI)
  realesrgan_model_name: "RealESRGAN_x4plus"
  realesrgan_tile: 400           # 0 = no tiling; raise/lower for your GPU VRAM
  realesrgan_fp32: true          # true = deterministic-ish, slower; false = fp16

  # SwinIR inference settings
  swinir_task: "real_sr"
  swinir_scale: 4                # REQUIRED for real_sr: without --scale 4,
                                  # the model is built for upscale=1 and its
                                  # conv_up2 layer never gets created, which
                                  # then fails to load the x4 checkpoint's
                                  # conv_up2 weights.
  swinir_large_model: true       # --large_model flag -> SwinIR-L (not -M)
  swinir_tile: null              # null = no tiling (whole image at once).
                                  # KEEP THIS NULL for EarVN1.0: ear crops
                                  # are small, and main_test_swinir.py's
                                  # tiling code has an edge-case bug that
                                  # crashes with "range() arg 3 must not
                                  # be zero" whenever an image's shorter
                                  # side exactly equals tile_overlap
                                  # (default 32px) -- a near-certainty
                                  # somewhere across 28k images of varying
                                  # size. Only set this if you have very
                                  # large source photos and hit GPU OOM
                                  # running them whole -- and even then,
                                  # expect occasional crashes on small
                                  # images mixed into the same dataset.

dataset:
  # First N subject folders are male, remaining are female (per EarVN1.0 docs)
  n_male_subjects: 98
  n_total_subjects: 164
  image_extensions: [".jpg", ".jpeg", ".png", ".JPG", ".JPEG", ".PNG"]

  # If a native image's longer side is already >= this value, PadResize224
  # would DOWNSCALE it anyway (no missing detail for SR to recover), so
  # bicubic/realesrgan/swinir variants fall back to reading Original pixels
  # directly for that image instead of running an SR/bicubic x4 pass that
  # (a) has nothing genuine to add and (b) was measured to introduce a
  # redundant-resize blur artifact that grows with native size (~23%
  # sharpness loss at native short-side ~140px in our own tests).
  #
  # DEFAULT IS null (DISABLED) -- do not enable this for the MAIN Table 3 /
  # Figure 2 benchmark. Doing so would force Delta_SR=0 by construction for
  # every image at/above the threshold, turning an empirical question
  # ("does SR help large crops?") into a circular assumption baked into the
  # pipeline, AND it silently changes the experimental condition from
  # "generic, unconditional SR preprocessing" (Eq. 1-4, matching the
  # paper's stated methodology) into a different, size-adaptive
  # preprocessing pipeline the paper doesn't claim to study.
  #
  # This flag exists ONLY for a clearly-labeled, SEPARATE robustness/
  # sensitivity re-run: set it to 224, rerun scripts/08+09 into a different
  # results/ subdirectory, and report it alongside (not instead of) the
  # main unconditional-SR Table 3, e.g. "does the measured Delta_SR at
  # native size >=224px survive once the redundant-resize confound is
  # removed, or does it disappear -- consistent with SR having nothing to
  # add there either way?" That framing keeps the large-size regime an
  # empirical finding rather than an assumption.
  skip_upsample_if_native_long_side_at_least: null

protocol_b:
  n_folds: 5
  val_fraction_of_train_subjects: 0.15   # per-fold, subject-level, stratified by gender
  seed: 42

protocol_a:
  test_fraction: 0.5
  seed: 42
